<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>ShulApp (v2)</title>
	<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full w-full bg-gray-100">

	<div class="p-8 max-w-7xl mx-auto">
		<h1 class="text-3xl font-bold text-center mb-6">ShulApp</h1>

		<!-- Tab Navigation -->
		<div class="flex justify-center mb-6">
			<button onclick="showTab('main')" class="tab-btn px-4 py-2 bg-blue-600 text-white rounded-l">Main</button>
			<button onclick="showTab('settings')"
				class="tab-btn px-4 py-2 bg-blue-100 text-blue-800 rounded-r">Settings</button>
		</div>

		<!-- Tab: Main (Input + Results) -->
		<div id="tab-main" class="tab-content">
			<!-- Inputs -->
			<div class="flex justify-between space-x-4 mb-10">
				<div class="w-1/3 text-center space-y-4" id="groupA">
					<h2 class="text-xl font-semibold">My Input</h2>
					<textarea rows="15" cols="50" class="w-full border p-2"></textarea>
				</div>
				<div class="w-1/3 text-center space-y-4" id="groupB">
					<h2 class="text-xl font-semibold">Customer Input</h2>
					<textarea rows="15" cols="50" class="w-full border p-2"></textarea>
				</div>
				<div class="w-1/3 flex flex-col items-center justify-center space-y-2">
					<label for="charMatch" class="text-lg">char to match</label>
					<input type="range" min="1" max="7" value="4" id="charMatch" step="1" class="w-2/3"
						oninput="outputUpdate(value)">
					<output id="charMatchOut">4</output>
				</div>
			</div>

			<!-- Button + Status -->
			<div class="flex flex-col items-center space-y-6 mb-10">
				<!-- Error Icon -->
				<div id="error" class="hidden flex items-center space-x-2 text-red-600">
					<svg xmlns="http://www.w3.org/2000/svg" class="animate-pulse w-10 h-10" fill="none" viewBox="0 0 24 24"
						stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M12 9v2m0 4h.01M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" />
					</svg>
					<span class="text-lg font-medium">Mismatch Found</span>
				</div>

				<!-- Success Icon -->
				<div id="success" class="animate-pulse hidden flex items-center space-x-2 text-green-600">
					<svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24"
						stroke="currentColor">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
					</svg>
					<span class="text-lg font-medium">All Good!</span>
				</div>
				<div id="action">
					<input type="button" value="GO!"
						class="bg-sky-600 border border-sky-600 text-white px-4 py-2 rounded cursor-pointer" />
				</div>
			</div>

			<!-- Results -->
			<div class="flex justify-between space-x-6">
				<div id="forwardResultContainer" class="w-1/2 hidden">
					<h2 class="text-xl font-semibold mb-4">Forward Result</h2>
					<div id="result" class="flex flex-wrap gap-4"></div>
				</div>

				<div id="reverseResultContainer" class="w-1/2 hidden">
					<h2 class="text-xl font-semibold mb-4">Reverse Result</h2>
					<div id="resultRev" class="flex flex-wrap gap-4"></div>
				</div>
			</div>
		</div>

		<!-- Tab: Settings -->
		<div id="tab-settings" class="tab-content hidden">
			<h2 class="text-xl font-semibold mb-4">Settings</h2>
			<p class="text-gray-600">Placeholder settings content goes here. Add your configurations or controls here
				later.</p>
		</div>
	</div>

	<script src="js/logic.js"></script>
	<script>
		function outputUpdate(val) {
			document.getElementById('charMatchOut').value = val;
		}

		function showTab(tab) {
			const tabs = ['main', 'settings'];
			tabs.forEach(id => {
				const el = document.getElementById(`tab-${id}`);
				const btn = document.querySelector(`.tab-btn:nth-child(${tabs.indexOf(id) + 1})`);
				if (id === tab) {
					el.classList.remove('hidden');
					el.classList.add('block');
					btn.classList.add('bg-blue-600', 'text-white');
					btn.classList.remove('bg-blue-100', 'text-blue-800');
				} else {
					el.classList.remove('block');
					el.classList.add('hidden');
					btn.classList.remove('bg-blue-600', 'text-white');
					btn.classList.add('bg-blue-100', 'text-blue-800');
				}
			});
		}
	</script>
</body>

</html>
